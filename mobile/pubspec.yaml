
name: soto_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  device_preview: ^1.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  intl: ^0.20.2
  provider: ^6.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Konfigurasi launcher icon aplikasi mySOTO
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/mysoto.png"
  min_sdk_android: 21
